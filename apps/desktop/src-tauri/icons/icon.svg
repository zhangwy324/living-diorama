<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Source of every app icon size (ADR 0009 §16). From apps/desktop, run `pnpm tauri icon src-tauri/icons/icon.svg -o <temp dir>` and copy over only the files already here (it also makes 64x64, Android and iOS icons). -->
