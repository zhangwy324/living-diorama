[package]
name = "living-diorama"
version = "0.1.0"
description = "Living Diorama desktop shell"
edition = "2024"
publish = false

[lib]
# Distinct from the bin name to avoid a Windows linker clash (rust-lang/cargo#8519).
name = "living_diorama_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
