name: Release

# Pushing a tag vX.Y.Z builds the NSIS installer and publishes it as a GitHub pre-release
# (ADR 0009 §10), with the notes in docs/release-notes/<version>.md (ADR 0016 §14).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build installer and publish pre-release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # A release candidate tag (v0.1.0-rc.1) builds the version it names.
          base="${tag%%-*}"
          conf=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          echo "tag $tag, tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo"
          if [ "$base" != "$conf" ] || [ "$base" != "$pkg" ] || [ "$base" != "$cargo" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version in all three files"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"
      - name: Check the release notes exist
        run: |
          # A release candidate publishes the notes of the version it names (ADR 0016 §14).
          tag="${GITHUB_REF_NAME#v}"
          notes="docs/release-notes/${tag%%-*}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing $notes. Add the release notes for this version before tagging."
            exit 1
          fi
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      # The published installer keeps the shipped creature count (ADR 0016 §10).
      - run: tools/development/check-no-creature-count.sh
      - run: pnpm tauri build
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          gh release create "$GITHUB_REF_NAME" "$installer" \
            --prerelease \
            --title "Living Diorama $VERSION" \
            --notes-file "$NOTES"
